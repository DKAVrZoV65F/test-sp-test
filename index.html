<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="env.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка сети</title>
    <style>
        /* Строгий минимализм (Apple Style) */
        :root[data-theme="light"] {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --border: 1px solid rgba(0, 0, 0, 0.05);
            --text-main: #1d1d1f; 
            --text-muted: #86868b; 
            --accent: #007aff; 
            --bar-bg: rgba(0, 0, 0, 0.05); 
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --toggle-bg: rgba(0, 0, 0, 0.05);
        }
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7; 
            --text-muted: #a1a1a6; 
            --accent: #0a84ff; 
            --bar-bg: rgba(255, 255, 255, 0.1); 
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --toggle-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background: var(--card-bg);
            width: 90%; max-width: 420px;
            padding: 25px; border-radius: 24px; box-shadow: var(--shadow);
            border: var(--border); transition: background 0.3s, border 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;}
        .theme-toggle {
            background: var(--toggle-bg); border: none; font-size: 20px; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; transition: transform 0.2s, background 0.3s;
        }
        .theme-toggle:active { transform: scale(0.8); }

        /* Блок информации о сети */
        .network-info {
            text-align: left; font-size: 13px; color: var(--text-muted);
            margin-top: 5px; margin-bottom: 25px; min-height: 15px; font-weight: 500;
        }
        .ip-masked {
            filter: blur(4px); 
            cursor: pointer;
            transition: filter 0.3s ease;
            user-select: none;
        }
        .ip-masked.revealed {
            filter: blur(0); 
        }
        .ip-hint { font-size: 10px; opacity: 0.6; margin-left: 2px; cursor: pointer;}

        /* Аккордеон сервисов */
        details { margin-top: 20px; background: var(--bar-bg); border-radius: 16px; overflow: hidden; }
        summary {
            padding: 15px; font-weight: 600; cursor: pointer; user-select: none;
            display: flex; justify-content: space-between; align-items: center; list-style: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 12px; transition: transform 0.3s; color: var(--text-muted); }
        details[open] summary::after { transform: rotate(180deg); }
        
        .services-list { padding: 0 15px 15px 15px; }
        .service-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid rgba(128,128,128,0.2); font-size: 15px;
        }
        .service-item:last-child { border-bottom: none; }
        .service-link { color: var(--text-main); text-decoration: none; font-weight: 500; }
        .service-link:hover { color: var(--accent); text-decoration: underline; }
        .status-ok { color: #34c759; font-weight: 500;} 
        .status-warn { color: #ff9f0a; font-weight: 500;} 
        .status-error { color: #ff453a; font-weight: 500;}

        .btn-refresh {
            background: var(--accent); color: #fff; border: none;
            padding: 16px; width: 100%; font-size: 18px; font-weight: 600;
            border-radius: 16px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 15px;
        }
        .btn-refresh:active { transform: scale(0.97); }
        .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status-indicator {
            text-align: center; padding: 12px; margin: 20px 0;
            border-radius: 12px; font-weight: 600; font-size: 14px; line-height: 1.4;
        }
        .status-good { background: rgba(52, 199, 89, 0.15); color: #34c759; }
        .status-mixed { background: rgba(255, 159, 10, 0.15); color: #ff9f0a; }
        .status-bad { background: rgba(255, 69, 58, 0.15); color: #ff453a; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Проверка сети</h2>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
    
    <div class="network-info" id="networkInfo">Определение провайдера...</div>

    <details id="services-details" open>
        <summary>Доступность сервисов</summary>
        <div class="services-list">
            <div class="service-item">
                <a href="#" onclick="openLink('https://vk.com')" class="service-link">ВКонтакте</a>
                <span id="status-vk">⏳</span>
            </div>
            <div class="service-item">
                <a href="#" onclick="openLink('https://telegram.org')" class="service-link">Telegram</a>
                <span id="status-tg">⏳</span>
            </div>
            <div class="service-item">
                <a href="#" onclick="openLink('https://youtube.com')" class="service-link">YouTube</a>
                <span id="status-yt">⏳</span>
            </div>
        </div>
    </details>

    <div id="statusIndicator" class="status-indicator" style="display: none;"></div>

    <button class="btn-refresh" id="refreshBtn" onclick="refreshNetwork()">Обновить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 

    // Тема (переключатель)
    let isDark = true;
    function toggleTheme() {
        isDark = !isDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.getElementById('themeBtn').innerText = isDark ? '🌙' : '☀️';
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    // Безопасное открытие ссылок
    function openLink(url) {
        if (tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0) {
            tg.openLink(url);
        } else {
            window.open(url, '_blank');
        }
    }

    // Получение IPv4 и названия провайдера
    async function fetchNetworkInfo() {
        try {
            const res = await fetch('https://ipv4.geojs.io/v1/ip/geo.json');
            const data = await res.json();
            let org = data.organization_name || data.organization || "Неизвестная сеть";
            
            document.getElementById('networkInfo').innerHTML = 
                `IP: <span class="ip-masked" id="ipSpan" onclick="toggleIp()">${data.ip}</span> <span class="ip-hint" onclick="toggleIp()">(показать)</span> • ${org}`;
        } catch (e) {
            document.getElementById('networkInfo').innerText = "Сеть готова к проверке";
        }
    }

    // Переключение видимости IP
    function toggleIp() {
        const ipSpan = document.getElementById('ipSpan');
        if (ipSpan) {
            ipSpan.classList.toggle('revealed');
            document.querySelector('.ip-hint').textContent = ipSpan.classList.contains('revealed') ? '(скрыть)' : '(показать)';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
    }

    // ОСНОВНАЯ ФУНКЦИЯ ОБНОВЛЕНИЯ
    async function refreshNetwork() {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.innerText = "Обновление...";
        document.getElementById('statusIndicator').style.display = 'none';

        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        // Сброс статусов сервисов
        ['status-vk', 'status-tg', 'status-yt'].forEach(id => document.getElementById(id).innerText = "⏳");

        try {
            // Параллельно обновляем IP и проверяем сервисы
            await Promise.all([
                fetchNetworkInfo(),
                checkServices()
            ]);
            
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } catch (e) {
            console.error(e);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        }

        btn.disabled = false;
        btn.innerText = "Обновить";
    }

    // Проверка сервисов по иконкам (Favicons) С МС!
    function checkServices() {
        pingService('https://vk.com/favicon.ico', 'status-vk');
        pingService('https://telegram.org/favicon.ico', 'status-tg');
        pingService('https://www.youtube.com/favicon.ico', 'status-yt');
    }

    function pingService(url, elementId) {
        const el = document.getElementById(elementId);
        const img = new Image();
        const startTime = performance.now();
        
        const timeoutId = setTimeout(() => {
            img.src = ""; 
            el.innerHTML = "<span class='status-error'>❌ Таймаут</span>";
            updateStatusIndicator();
        }, 3000);

        img.onload = function() {
            clearTimeout(timeoutId);
            const duration = Math.round(performance.now() - startTime);
            if (duration < 500) {
                el.innerHTML = `<span class='status-ok'>✅ ${duration} мс</span>`;
            } else {
                el.innerHTML = `<span class='status-warn'>⚠️ ${duration} мс</span>`;
            }
            updateStatusIndicator();
        };

        img.onerror = function() {
            clearTimeout(timeoutId);
            el.innerHTML = "<span class='status-error'>❌ Ошибка</span>";
            updateStatusIndicator();
        };

        img.src = url + "?t=" + Date.now();
    }

    // Общий статус сети (по доступности, без учета ms)
    function updateStatusIndicator() {
        const statuses = {
            vk: !document.getElementById('status-vk').innerHTML.includes('❌') && !document.getElementById('status-vk').innerHTML.includes('⏳'),
            tg: !document.getElementById('status-tg').innerHTML.includes('❌') && !document.getElementById('status-tg').innerHTML.includes('⏳'),
            yt: !document.getElementById('status-yt').innerHTML.includes('❌') && !document.getElementById('status-yt').innerHTML.includes('⏳')
        };

        const okCount = Object.values(statuses).filter(Boolean).length;
        const box = document.getElementById('statusIndicator');
        
        if (okCount === 3) {
            box.className = 'status-indicator status-good';
            box.innerHTML = '🚀 Все сервисы доступны';
        } else if (okCount >= 2) {
            box.className = 'status-indicator status-mixed';
            box.innerHTML = '👍 Большинство сервисов работает';
        } else {
            box.className = 'status-indicator status-bad';
            box.innerHTML = '🐌 Проблемы с доступностью';
        }
        
        box.style.display = 'block';
    }

    // Автозапуск при загрузке
    window.addEventListener('load', () => {
        refreshNetwork();
    });
</script>
</body>
</html>
