name: Update ngrok URL in index.html

on:
  workflow_dispatch:        # запуск вручную

permissions:
  contents: write            # разрешение коммитить

jobs:
  update-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace placeholder with actual URL
        run: |
          # Заменяем {{NGROK_URL}} на значение из секрета
          sed -i "s|{{NGROK_URL}}|${{ secrets.NGROK_URL }}|g" index.html

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          # Проверяем, есть ли изменения
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ngrok URL from secret [skip ci]"
          git push
